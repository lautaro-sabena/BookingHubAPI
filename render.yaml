services:
  - type: web
    name: bookinghub-api
    region: us
    plan: free
    rootDirectory: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # .NET binds environment variables with double underscores as config-section separators
      # (Jwt__SecretKey -> configuration key "Jwt:SecretKey"); a flat JWT_SECRET_KEY never bound.
      - key: Jwt__SecretKey
        sync: false
      - key: Jwt__Issuer
        value: BookingHubAPI
      - key: Jwt__Audience
        value: BookingHubAPI
      - key: Cors__AllowedOrigins
        value: https://bookinghubapi-frontend-h0ui.onrender.com
      # Render's proxy IP isn't published/fixed, so we can't pin KnownProxies/KnownNetworks;
      # this trusts the immediate peer as the sole ingress. See Program.cs for the tradeoff.
      - key: ForwardedHeaders__TrustAllProxies
        value: "true"
      # Shared secret with the frontend (same value on both services). Requests through the frontend's /api
      # proxy carry it in X-Frontend-Proxy-Key; only then does the API also skip the frontend hop in
      # X-Forwarded-For ("<client>, <frontend egress IP>") and rate-limit per real client. Direct calls to the API
      # trust the rightmost entry only, so a spoofed X-Forwarded-For cannot evade the limits. Generate a long random
      # value (e.g. openssl rand -base64 32). Without it every user behind the frontend shares one rate-limit counter.
      - key: FRONTEND_PROXY_KEY
        sync: false
      # The session cookie is host-only, HttpOnly, SameSite=Lax and Secure (the default outside Development).
      # The frontend proxies /api, so browsers no longer call this origin: the CORS whitelist above only serves
      # other browser origins that call the API directly and needs no credentials.

  - type: web
    name: bookinghub-frontend
    region: us
    plan: free
    rootDirectory: frontend
    dockerfilePath: render.Dockerfile
    envVars:
      # Server-side target of the /api/* proxy (rewrites in next.config.js). Use the API's PUBLIC https URL:
      # its edge appends the frontend's IP to X-Forwarded-For, which the API's frontend-hop trust relies on.
      # Read at BUILD time (render.Dockerfile ARG): changing it requires a redeploy with a rebuild.
      - key: BACKEND_URL
        value: https://bookinghubapi.onrender.com
      - key: NODE_ENV
        value: production
      # Same value as the API's FRONTEND_PROXY_KEY. Read at runtime by src/proxy.ts, server-only (never NEXT_PUBLIC_).
      - key: FRONTEND_PROXY_KEY
        sync: false